services:
  db:
    image: postgres:16-alpine
    container_name: mimelux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mimelux
      POSTGRES_USER: mimelux
      POSTGRES_PASSWORD: mimelux_dev
    ports:
      - "5432:5432"
    volumes:
      - mimelux_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimelux -d mimelux"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mimelux_postgres_data:
