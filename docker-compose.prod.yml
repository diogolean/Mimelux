name: patrocino
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: patrocino
      POSTGRES_USER: patrocino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U patrocino -d patrocino"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 10s, timeout: 3s, retries: 10}
  migrate:
    image: patrocino-app:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
    env_file: .env
    working_dir: /app/packages/db
    command: ["sh","-c","npx prisma migrate deploy && (npx tsx prisma/seed.ts || echo SEED_FAILED)"]
    depends_on: {db: {condition: service_healthy}}
    restart: "no"
  api:
    image: patrocino-app:latest
    env_file: .env
    environment: {PORT: "3334", MEDIA_ROOT: "/opt/patrocino/media"}
    working_dir: /app/apps/api
    command: ["node","dist/main.js"]
    restart: unless-stopped
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck: {test: ["CMD","node","-e","fetch('http://localhost:3334/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 10}
    volumes: ["/opt/patrocino/media:/opt/patrocino/media"]
  web:
    image: patrocino-app:latest
    env_file: .env
    environment: {MEDIA_ROOT: "/opt/patrocino/media"}
    working_dir: /app/apps/web
    command: ["npx","next","start","--hostname","0.0.0.0","--port","3333"]
    restart: unless-stopped
    depends_on: [api]
    healthcheck: {test: ["CMD","node","-e","fetch('http://localhost:3333/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 10}
    volumes: ["/opt/patrocino/media:/opt/patrocino/media"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80","443:443","443:443/udp"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data, caddyconfig:/config, /opt/patrocino/media:/srv/media:ro]
    depends_on: [web, api]
volumes: {pgdata: {}, redisdata: {}, caddydata: {}, caddyconfig: {}}
